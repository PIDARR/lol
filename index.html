<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <canvas id="heartCanvas"></canvas>

<audio id="bg-music" loop preload="auto" muted>
  <source src="assets/cha.mp3" type="audio/mpeg">
  Your browser doesn't support audio — sorry bogoss 😔
</audio>

  <script src="script.js"></script>

  <audio id="bg-music" loop preload="auto" muted>
    <source src="assets/cha.mp3" type="audio/mpeg">
    change de navigateur bogoss
  </audio>

  <script src="script.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const audio = document.getElementById("bg-music");

      function tryPlay() {
        audio.muted = false;  // Make sure it's unmuted right before attempting play

        const playPromise = audio.play();

        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              console.log("Music started successfully!");
            })
            .catch(err => {
              console.error("Play attempt failed:", err.name, err.message);
              // Common: NotAllowedError means still needs stronger user gesture
            });
        }
      }

      // Trigger on first click anywhere on the page
      document.addEventListener("click", function handler() {
        tryPlay();
        document.removeEventListener("click", handler);  // Only try once
      }, { once: true });

      // Extra for mobile/touch (some devices prefer touchend)
      document.addEventListener("touchend", function handler() {
        tryPlay();
        document.removeEventListener("touchend", handler);
      }, { once: true, passive: true });
    });
  </script>
</body>
</html>
