<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chachaaa</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <canvas id="heartCanvas"></canvas>

  <audio id="bg-music" loop preload="auto">
    <source src="assets/cha.mp3" type="audio/mpeg">
    change de navigateur bogoss
  </audio>

  <!-- Overlay for iOS-friendly gesture -->
  <div id="start-screen">
    <button id="start-btn">Tap to play music ❤️</button>
  </div>

  <script src="script.js"></script>

  <script>
    const audio = document.getElementById('bg-music');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');

    // Hide overlay and play on direct button tap/click
    function startMusic() {
      startScreen.style.display = 'none';  // or add a class for fade-out

      audio.muted = false;
      audio.currentTime = 0;  // optional: restart from beginning

      audio.play()
        .then(() => {
          console.log('Music playing on iOS Safari!');
        })
        .catch(err => {
          console.error('Play failed:', err);
          // If still blocked (rare), you can alert or retry
          alert('Tap again if music doesn\'t start — iOS sometimes needs it twice.');
        });
    }

    // Attach directly to the button (Safari likes this best)
    startBtn.addEventListener('click', startMusic);
    startBtn.addEventListener('touchend', startMusic);  // for touch reliability

    // Optional: fallback if someone clicks elsewhere first
    document.addEventListener('click', () => {
      if (startScreen.style.display !== 'none') {
        startMusic();
      }
    }, { once: true });
  </script>
</body>
</html>
